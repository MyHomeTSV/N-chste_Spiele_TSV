<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>TSV Großenkneten - Vereinsspiele</title>
  <script
    type="text/javascript"
    src="https://www.fussball.de/widgets.js">
  </script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      width: 100%;
      height: 100%;
    }

    :root {
      --zoom: 1.3;         /* Größe von Schrift/Logos */
      --crop-left: 60px;   /* linker Pfeil-Button wird abgeschnitten */
      --crop-right: 240px; /* rechter Pfeil + "Zum Spiel"-Link werden abgeschnitten */
      --max-height: 700px; /* Gesamthöhe des sichtbaren Bereichs (Anzahl Spiele) */
    }

    #viewport {
      width: 100vw;
      max-height: var(--max-height);
      overflow: hidden;
      position: relative;
    }

    #shifter {
      position: relative;
      left: calc(-1 * var(--crop-left));
      width: calc(100% + var(--crop-left) + var(--crop-right));
    }

    .fussballde_widget {
      width: 100% !important;
      zoom: var(--zoom);
    }

    /* Diese Klasse setzen wir per JavaScript auf die Filter-/Suchzeile */
    .tsv-hidden-bar {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="viewport">
    <div id="shifter">
      <div
        class="fussballde_widget"
        data-id="8ad65808-17b7-44b8-a226-a60f94e764cc"
        data-type="club-matches"
        style="width: 100%"
      ></div>
    </div>
  </div>

  <script>
    // Sucht das Suchfeld ("Nächste Spiele") im Widget und blendet die
    // ganze Zeile drumherum (Pfeile + Suchfeld + Filter-Icon) aus.
    function hideFilterBar(widgetEl) {
      var inputs = widgetEl.querySelectorAll('input');
      var hiddenAny = false;
      var widgetWidth = widgetEl.offsetWidth;

      inputs.forEach(function (input) {
        var el = input;
        for (var i = 0; i < 6 && el.parentElement; i++) {
          el = el.parentElement;
          if (el.offsetWidth >= widgetWidth * 0.85) {
            el.classList.add('tsv-hidden-bar');
            hiddenAny = true;
            break;
          }
        }
      });

      return hiddenAny;
    }

    var widgetEl = document.querySelector('.fussballde_widget');
    var attempts = 0;
    var timer = setInterval(function () {
      attempts++;
      var done = hideFilterBar(widgetEl);
      if (done || attempts > 100) {
        clearInterval(timer);
      }
    }, 200);
  </script>
</body>
</html>
